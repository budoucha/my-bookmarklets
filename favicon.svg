<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>My Bookmarklets</title>
  <defs>
    <linearGradient id="gearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8694"/>
      <stop offset="1" stop-color="#3f4a59"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14a"/>
      <stop offset="1" stop-color="#f5b800"/>
    </linearGradient>
  </defs>

  <g transform="translate(44 44)">
    <g fill="url(#gearGrad)" stroke="#2a313b" stroke-width="1.1" stroke-linejoin="round">
      <g>
        <rect x="-3" y="-20" width="6" height="7" rx="1"/>
        <g transform="rotate(45)"><rect x="-3" y="-20" width="6" height="7" rx="1"/></g>
        <g transform="rotate(90)"><rect x="-3" y="-20" width="6" height="7" rx="1"/></g>
        <g transform="rotate(135)"><rect x="-3" y="-20" width="6" height="7" rx="1"/></g>
        <g transform="rotate(180)"><rect x="-3" y="-20" width="6" height="7" rx="1"/></g>
        <g transform="rotate(225)"><rect x="-3" y="-20" width="6" height="7" rx="1"/></g>
        <g transform="rotate(270)"><rect x="-3" y="-20" width="6" height="7" rx="1"/></g>
        <g transform="rotate(315)"><rect x="-3" y="-20" width="6" height="7" rx="1"/></g>
      </g>
      <circle r="15"/>
    </g>
    <circle r="5.5" fill="#2a313b"/>
  </g>

  <polygon
    fill="url(#starGrad)"
    stroke="#a87400"
    stroke-width="1.4"
    stroke-linejoin="round"
    points="22,0 26.94,15.20 42.92,15.20 29.99,24.60 34.93,39.80 22,30.40 9.07,39.80 14.01,24.60 1.08,15.20 17.06,15.20"/>
