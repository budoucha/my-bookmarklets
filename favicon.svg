<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>My Bookmarklets</title>
  <defs>
    <linearGradient id="gearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa5b0"/>
      <stop offset="1" stop-color="#4a5568"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe566"/>
      <stop offset="1" stop-color="#f59e00"/>
    </linearGradient>
  </defs>

  <!-- Star (background) centered at 22,22, outer r=22, inner r=9 -->
  <polygon
    fill="url(#starGrad)"
    stroke="#a87400"
    stroke-width="1.2"
    stroke-linejoin="round"
    points="22,0 27.29,14.72 42.92,15.20 30.56,24.78 34.93,39.80 22,31 9.07,39.80 13.44,24.78 1.08,15.20 16.71,14.72"/>

  <!-- Gear (foreground) centered at 44,44, 8 realistic trapezoidal teeth -->
  <!-- tip r=18, root r=13, tooth tip half-angle=8°, root half-angle=15° -->
  <g transform="translate(44,44)">
    <path
      fill="url(#gearGrad)"
      stroke="#1a202c"
      stroke-width="0.9"
      stroke-linejoin="round"
      d="M12.56,-3.36 L17.83,-2.50 L17.83,2.50 L12.56,3.36
         L11.26,6.50 L14.37,10.83 L10.83,14.37 L6.50,11.26
         L3.36,12.56 L2.50,17.83 L-2.50,17.83 L-3.36,12.56
         L-6.50,11.26 L-10.83,14.37 L-14.37,10.83 L-11.26,6.50
         L-12.56,3.36 L-17.83,2.50 L-17.83,-2.50 L-12.56,-3.36
         L-11.26,-6.50 L-14.37,-10.83 L-10.83,-14.37 L-6.50,-11.26
         L-3.36,-12.56 L-2.50,-17.83 L2.50,-17.83 L3.36,-12.56
         L6.50,-11.26 L10.83,-14.37 L14.37,-10.83 L11.26,-6.50 Z"/>
    <!-- Hub ring -->
    <circle r="6" fill="#1a202c" stroke="#1a202c" stroke-width="0.5"/>
    <circle r="4.5" fill="url(#gearGrad)"/>
    <!-- Center bore -->
    <circle r="2.2" fill="#1a202c"/>
  </g>
</svg>
