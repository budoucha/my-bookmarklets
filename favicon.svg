<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>My Bookmarklets</title>
  <defs>
    <linearGradient id="gearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8694"/>
      <stop offset="1" stop-color="#3f4a59"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14a"/>
      <stop offset="1" stop-color="#f5b800"/>
    </linearGradient>
  </defs>
  <g transform="translate(32 32)">
    <g fill="url(#gearGrad)" stroke="#2a313b" stroke-width="1.2" stroke-linejoin="round">
      <g id="teeth">
        <rect x="-4" y="-30" width="8" height="10" rx="1.2"/>
        <g transform="rotate(45)"><rect x="-4" y="-30" width="8" height="10" rx="1.2"/></g>
        <g transform="rotate(90)"><rect x="-4" y="-30" width="8" height="10" rx="1.2"/></g>
        <g transform="rotate(135)"><rect x="-4" y="-30" width="8" height="10" rx="1.2"/></g>
        <g transform="rotate(180)"><rect x="-4" y="-30" width="8" height="10" rx="1.2"/></g>
        <g transform="rotate(225)"><rect x="-4" y="-30" width="8" height="10" rx="1.2"/></g>
        <g transform="rotate(270)"><rect x="-4" y="-30" width="8" height="10" rx="1.2"/></g>
        <g transform="rotate(315)"><rect x="-4" y="-30" width="8" height="10" rx="1.2"/></g>
      </g>
      <circle r="22"/>
    </g>
    <circle r="22" fill="none" stroke="#2a313b" stroke-width="1.2" opacity="0.6"/>
    <polygon
      fill="url(#starGrad)"
      stroke="#a87400"
      stroke-width="1.4"
      stroke-linejoin="round"
      points="0,-18 5.29,-5.56 18.78,-5.56 7.74,2.12 11.04,15.56 0,7.4 -11.04,15.56 -7.74,2.12 -18.78,-5.56 -5.29,-5.56"/>
  </g>
</svg>
